[package]
name = "qdrant-client"
version = "1.16.1-dev"
edition = "2021"
authors = ["Qdrant Team <team@qdrant.com>"]
description = "Rust client for Qdrant Vector Search Engine"
documentation = "https://docs.rs/qdrant-client"
homepage = "https://qdrant.tech/"
license = "Apache-2.0"
repository = "https://github.com/qdrant/rust-client"
readme = "README.md"
categories = ["database", "api-bindings"]
keywords = ["qdrant", "vector-search", "search-engine", "client", "grpc"]

[dependencies]
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots", "gzip"] }
tonic-prost = "0.14.6"
prost = "0.14.3"
prost-types = "0.14.3"
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["stream", "rustls", "http2"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
futures-util = { version = "0.3.32", optional = true }
derive_builder = { version = "0.20.2" }
thiserror = "2.0.18"
semver = "1.0.28"
uuid = { version = "1.23.1", optional = true }
parking_lot = "0.12.4"

[dev-dependencies]
tonic-prost-build = { version = "0.14.6" }

[features]
default = ["download_snapshots", "serde", "generate-snippets"]
download_snapshots = ["reqwest", "futures-util"]
serde = ["dep:serde", "dep:serde_json"]
generate-snippets = []
uuid = ["dep:uuid"]

[[example]]
name = "query"
required-features = ["serde"]

[[example]]
name = "serverless"
required-features = ["serde"]

[package.metadata.docs.rs]
features = ["download_snapshots", "serde"]
no-default-features = true
